$kind: http-request
name: "{{base_url}}/auth/login"
description: ""
url: "{{base_url}}/auth/login"
method: POST
headers:
  Accept: application/json
body:
  type: json
  content: "{\r

    \  \"email\": \"admin@example.com\",\r

    \  \"password\": \"password\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "JavaScript\r

      const res = pm.response.json();\r

      if (res.token || res.access_token) {\r

      \    pm.environment.set(\"admin_token\", res.token || res.access_token);\r

      }"
    language: text/javascript
order: 1000
